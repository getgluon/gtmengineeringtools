<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Profile Lookup</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 16px 80px;
      color: #1a1d23;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #111827;
    }

    header p {
      margin-top: 8px;
      font-size: 1rem;
      color: #6b7280;
    }

    .search-bar {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 540px;
      margin-bottom: 48px;
    }

    .search-bar input {
      flex: 1;
      padding: 14px 18px;
      border: 1.5px solid #d1d5db;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
      color: #111827;
    }

    .search-bar input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }

    .search-bar input::placeholder { color: #9ca3af; }

    .search-bar button {
      padding: 14px 24px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .search-bar button:hover { background: #4f46e5; }
    .search-bar button:active { transform: scale(0.97); }
    .search-bar button:disabled { background: #a5b4fc; cursor: not-allowed; transform: none; }

    /* ── Card ─────────────────────────────────────── */
    #card-area {
      width: 100%;
      max-width: 540px;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      overflow: hidden;
      animation: fadeUp 0.35s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card-banner {
      height: 8px;
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
    }

    .card-body {
      padding: 32px 32px 28px;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 24px;
    }

    .company-avatar {
      width: 64px;
      height: 64px;
      border-radius: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
      letter-spacing: -1px;
    }

    .company-meta h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #111827;
      line-height: 1.2;
    }

    .company-meta .tagline {
      margin-top: 4px;
      font-size: 0.875rem;
      color: #6b7280;
      font-style: italic;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .badge-industry {
      background: #ede9fe;
      color: #6d28d9;
    }

    .badge-size {
      background: #dcfce7;
      color: #166534;
    }

    .badge-founded {
      background: #fef3c7;
      color: #92400e;
    }

    .badge-hq {
      background: #e0f2fe;
      color: #075985;
    }

    .divider {
      border: none;
      border-top: 1px solid #f3f4f6;
      margin: 0 0 20px;
    }

    .section-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .description {
      font-size: 0.95rem;
      line-height: 1.65;
      color: #374151;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .stat-box {
      background: #f9fafb;
      border-radius: 12px;
      padding: 14px 12px;
      text-align: center;
    }

    .stat-box .stat-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: #111827;
    }

    .stat-box .stat-label {
      font-size: 0.72rem;
      color: #9ca3af;
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── States ───────────────────────────────────── */
    .state-box {
      text-align: center;
      padding: 40px 20px;
    }

    .state-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }

    .state-box h3 {
      font-size: 1rem;
      font-weight: 600;
      color: #374151;
    }

    .state-box p {
      font-size: 0.875rem;
      color: #9ca3af;
      margin-top: 4px;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e5e7eb;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 14px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-box {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 14px;
      padding: 24px;
      text-align: center;
    }

    .error-box .state-icon { font-size: 2rem; }
    .error-box h3 { color: #be123c; }
    .error-box p { color: #9f1239; font-size: 0.85rem; margin-top: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>Company Profile Lookup</h1>
    <p>Enter a company name to see a quick snapshot.</p>
  </header>

  <div class="search-bar">
    <input id="company-input" type="text" placeholder="e.g. Stripe, Notion, OpenAI…" autocomplete="off" />
    <button id="search-btn">Look up</button>
  </div>

  <div id="card-area"></div>

  <script>
    const input = document.getElementById('company-input');
    const btn   = document.getElementById('search-btn');
    const area  = document.getElementById('card-area');

    // Trigger on Enter key
    input.addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });
    btn.addEventListener('click', lookup);

    function initials(name) {
      return name.trim().split(/\s+/).slice(0, 2)
        .map(w => w[0].toUpperCase()).join('');
    }

    function setLoading() {
      area.innerHTML = `
        <div class="card">
          <div class="card-banner"></div>
          <div class="card-body">
            <div class="state-box">
              <div class="spinner"></div>
              <h3>Looking up company…</h3>
              <p>This only takes a moment</p>
            </div>
          </div>
        </div>`;
    }

    function setError(msg) {
      area.innerHTML = `
        <div class="error-box">
          <div class="state-icon">⚠️</div>
          <h3>Something went wrong</h3>
          <p>${msg}</p>
        </div>`;
    }

    function renderCard(data) {
      const avg = initials(data.name);
      area.innerHTML = `
        <div class="card">
          <div class="card-banner"></div>
          <div class="card-body">
            <div class="card-top">
              <div class="company-avatar">${avg}</div>
              <div class="company-meta">
                <h2>${escape(data.name)}</h2>
                ${data.tagline ? `<div class="tagline">"${escape(data.tagline)}"</div>` : ''}
              </div>
            </div>

            <div class="badges">
              ${data.industry  ? `<span class="badge badge-industry">&#x1F3E2; ${escape(data.industry)}</span>` : ''}
              ${data.size      ? `<span class="badge badge-size">&#x1F465; ${escape(data.size)}</span>` : ''}
              ${data.founded   ? `<span class="badge badge-founded">&#x1F4C5; Founded ${escape(data.founded)}</span>` : ''}
              ${data.hq        ? `<span class="badge badge-hq">&#x1F4CD; ${escape(data.hq)}</span>` : ''}
            </div>

            <hr class="divider" />

            <div class="section-label">About</div>
            <div class="description">${escape(data.description)}</div>

            ${(data.revenue || data.valuation || data.employees) ? `
            <div class="stats-row">
              ${data.employees  ? `<div class="stat-box"><div class="stat-value">${escape(data.employees)}</div><div class="stat-label">Employees</div></div>` : ''}
              ${data.revenue    ? `<div class="stat-box"><div class="stat-value">${escape(data.revenue)}</div><div class="stat-label">Revenue</div></div>` : ''}
              ${data.valuation  ? `<div class="stat-box"><div class="stat-value">${escape(data.valuation)}</div><div class="stat-label">Valuation</div></div>` : ''}
            </div>` : ''}
          </div>
        </div>`;
    }

    function escape(str) {
      if (!str) return '';
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function lookup() {
      const company = input.value.trim();
      if (!company) { input.focus(); return; }

      btn.disabled = true;
      setLoading();

      try {
        const res = await fetch('/api/company', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ company })
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error || `Server error ${res.status}`);
        }

        const data = await res.json();
        renderCard(data);
      } catch (e) {
        setError(e.message);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
